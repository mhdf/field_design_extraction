[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "field_design_extraction"
version = "0.1.0"
description = "Turn spreadsheet field maps and rating sheets into a design table and one ratings table per date"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas", "openpyxl", "numpy"]

[project.optional-dependencies]
plots = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
