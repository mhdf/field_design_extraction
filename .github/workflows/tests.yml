# Runs the tests on GitHub (Linux) for every push to main and every pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with matplotlib
        run: pip install -e ".[plots]"

      - name: Run the tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -t tests
